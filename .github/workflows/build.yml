# Tinc Mesh VPN: Android client and user interface
#
# Builds the app and checks that the bundled tinc daemon came out right.
#
# The tinc sources are a git submodule (see ../.gitmodules) and the daemon is
# compiled from them by app/CMakeLists.txt, so the checkout step must recurse.

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Android Gradle plugin downloads the NDK named by ndkVersion, which
      # is a little under a gigabyte; cache it so only the first run pays that.
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk
          key: ndk-29.0.14206865-${{ runner.os }}

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Verify bundled tinc
        run: |
          set -euo pipefail

          apks=$(find app/build/outputs/apk -name '*.apk' | sort)

          if [ -z "${apks}" ]; then
            echo "::error::the build produced no APK"
            exit 1
          fi

          status=0

          # Every build type is checked: debug and release compile the native
          # code with different CMAKE_BUILD_TYPE, so they are not the same
          # binaries and neither one vouches for the other.
          for apk in ${apks}; do
            echo "== ${apk}"

            tmp=$(mktemp -d)
            # -o so a name clash can never turn into an interactive prompt,
            # which would hang the job instead of failing it.
            unzip -oq "${apk}" -d "${tmp}"

            for abi in arm64-v8a armeabi-v7a x86 x86_64; do
              for lib in libtinc.so libtincd.so; do
                file="${tmp}/lib/${abi}/${lib}"

                if [ ! -f "${file}" ]; then
                  echo "::error::${apk}: ${abi}/${lib} is missing"
                  status=1
                  continue
                fi

                # Android 15 and later refuse to load a program whose LOAD
                # segments are not aligned to a 16 KiB page. readelf failing (a
                # file that is not an ELF, say) leaves this empty, which the
                # comparison below reports as such rather than aborting the step.
                alignment=$(readelf -lW "${file}" 2>/dev/null | awk '$1 == "LOAD" {print $NF}' | sort -u) || true
                if [ "${alignment}" != "0x4000" ]; then
                  echo "::error::${apk}: ${abi}/${lib} LOAD alignment is '${alignment}', expected 0x4000"
                  status=1
                fi

                # Catches the submodule being pinned to a revision without the
                # WebSocket metadata transport, which would otherwise link.
                # It lives in tincd only: the CLI does not compile meta_ws.c.
                if [ "${lib}" = "libtincd.so" ] && ! strings "${file}" | grep -q 'Sec-WebSocket-Accept'; then
                  echo "::error::${apk}: ${abi}/${lib} has no WebSocket metadata transport"
                  status=1
                fi

                # The version comes from the CMake TINC_VERSION_STRING setting.
                if ! strings "${file}" | grep -q '1\.1-ws'; then
                  echo "::error::${apk}: ${abi}/${lib} has no tinc version string"
                  status=1
                fi

                echo "   ${abi}/${lib}: OK (alignment ${alignment})"
              done
            done

            rm -rf "${tmp}"
          done

          exit "${status}"

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tincapp-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
